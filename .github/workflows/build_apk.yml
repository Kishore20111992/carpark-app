name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Prepare Android Project & Dependencies
        run: |
          cd mobile_app
          cp lib/main.dart /tmp/real_main.dart
          cp pubspec.yaml /tmp/real_pubspec.yaml
          flutter create . --platforms=android --org com.parkflow.app
          cp /tmp/real_main.dart lib/main.dart
          cp /tmp/real_pubspec.yaml pubspec.yaml
          sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET"\/>\n    <application/' android/app/src/main/AndroidManifest.xml
          flutter pub get

      - name: Build Android APKs (Release and Debug)
        run: |
          cd mobile_app
          flutter build apk --debug
          flutter build apk --release

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: ParkFlow-Android-Release-APK
          path: mobile_app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Upload Debug APK (Instant Sideload)
        uses: actions/upload-artifact@v4
        with:
          name: ParkFlow-Android-Debug-APK
          path: mobile_app/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30

      - name: Publish Direct APK Download on GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.3
          name: "ParkFlow Mobile v1.0.3 APK Release"
          body: |
            ### 🅿️ ParkFlow Smart Parking Mobile App (Android APK v1.0.3)
            The official compiled ParkFlow Mobile App with full live dashboard, advance booking, FASTag exit, and bay visualizer.
            
            Download and tap the APK directly on your phone to install:
            - **`app-debug.apk`** (Recommended for instant testing without keystore verification)
            - **`app-release.apk`** (Optimized release build)
          files: |
            mobile_app/build/app/outputs/flutter-apk/app-release.apk
            mobile_app/build/app/outputs/flutter-apk/app-debug.apk
