name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Prepare Android Project & Dependencies
        run: |
          cd mobile_app
          cp -r lib /tmp/parkflow_lib
          cp pubspec.yaml /tmp/parkflow_pubspec.yaml
          flutter create . --platforms=android --org com.parkflow.app --project-name parkflow_mobile
          rm -rf lib test
          cp -r /tmp/parkflow_lib lib
          cp /tmp/parkflow_pubspec.yaml pubspec.yaml
          python3 configure_android.py
          flutter pub get

      - name: Build Android APKs (Release and Debug)
        run: |
          cd mobile_app
          flutter build apk --debug
          flutter build apk --release

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: ParkFlow-Android-Release-APK
          path: mobile_app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Upload Debug APK (Instant Sideload)
        uses: actions/upload-artifact@v4
        with:
          name: ParkFlow-Android-Debug-APK
          path: mobile_app/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30

      - name: Publish Direct APK Download on GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.5
          name: "ParkFlow Mobile v1.0.5 APK Release (Full Feature Parity)"
          body: |
            ### 🅿️ ParkFlow Smart Parking Mobile App (Android APK v1.0.5)
            Full feature parity with the ParkFlow Web Application!
            - **Live 2D Bay Grid**: Clickable top KPI drill-down sheets + interactive bay details modal with instant check-in / checkout actions.
            - **Check-In**: Advance booking auto-detection & deposit credit + FASTag RFID auto-detection + Smart bay recommendation.
            - **Exit & Settlement**: Live itemized bill breakdown preview (Model B 30-min slabs, EV charging surcharge, GST 18%, upfront deposit credit) + Official Tax Invoice receipt.
            - **Reservations**: Advance booking form + full Reservations Ledger with instant check-in and auto-expiry sweep.
            - **Vehicle Locator**: Live dwell duration, walking directions, and 1-tap checkout.
            - **Analytics & Rates (NEW)**: Real-time revenue/occupancy metrics, interactive Tariff Rates Editor (modify hourly tariffs on the fly), and Transaction Audit Ledger.
            
            Download and install directly on your phone:
            - **`app-debug.apk`** (Recommended for instant testing without keystore prompts)
            - **`app-release.apk`** (Optimized release build)
          files: |
            mobile_app/build/app/outputs/flutter-apk/app-release.apk
            mobile_app/build/app/outputs/flutter-apk/app-debug.apk
