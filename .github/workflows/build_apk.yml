name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Prepare Android Project & Dependencies
        run: |
          # Create Android harness in a separate directory so lib/ and pubspec.yaml are never overwritten
          flutter create temp_app --platforms=android --org com.parkflow.app --project-name parkflow_mobile
          cp -r temp_app/android mobile_app/
          rm -rf temp_app
          # Restore our custom AndroidManifest with INTERNET permissions and cleartext traffic
          git checkout -- mobile_app/android/app/src/main/AndroidManifest.xml
          cd mobile_app
          flutter pub get

      - name: Build Android APKs (Release and Debug)
        run: |
          cd mobile_app
          flutter build apk --debug
          flutter build apk --release

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: ParkFlow-Android-Release-APK
          path: mobile_app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Upload Debug APK (Instant Sideload)
        uses: actions/upload-artifact@v4
        with:
          name: ParkFlow-Android-Debug-APK
          path: mobile_app/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30

      - name: Publish Direct APK Download on GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.1
          name: "ParkFlow Mobile v1.0.1 APK Release"
          body: |
            ### 🅿️ ParkFlow Smart Parking Mobile App (Android APK v1.0.1)
            The official compiled ParkFlow Mobile App with full live dashboard, advance booking, FASTag exit, and bay visualizer.
            
            Download and tap the APK directly on your phone to install:
            - **`app-debug.apk`** (Recommended for instant testing without keystore verification)
            - **`app-release.apk`** (Optimized release build)
          files: |
            mobile_app/build/app/outputs/flutter-apk/app-release.apk
            mobile_app/build/app/outputs/flutter-apk/app-debug.apk
