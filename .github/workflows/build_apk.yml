name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Prepare Android Project & Dependencies
        run: |
          # 1. Back up our custom ParkFlow lib/ and pubspec.yaml safely
          cp -r mobile_app/lib /tmp/parkflow_lib
          cp mobile_app/pubspec.yaml /tmp/parkflow_pubspec.yaml
          
          # 2. Run flutter create . to generate complete Android project harness and .metadata
          cd mobile_app
          flutter create . --platforms=android --org com.parkflow.app --project-name parkflow_mobile
          
          # 3. Restore our custom ParkFlow codebase and pubspec dependencies
          rm -rf lib
          cp -r /tmp/parkflow_lib lib
          cp /tmp/parkflow_pubspec.yaml pubspec.yaml
          
          # 4. Ensure INTERNET permission is added to AndroidManifest.xml
          python3 -c "
          with open('android/app/src/main/AndroidManifest.xml', 'r') as f:
              t = f.read()
          if 'android.permission.INTERNET' not in t:
              t = t.replace('<application', '<uses-permission android:name=\"android.permission.INTERNET\"/>\n    <application')
          with open('android/app/src/main/AndroidManifest.xml', 'w') as f:
              f.write(t)
          "
          
          # 5. Fetch project dependencies
          flutter pub get

      - name: Build Android APKs (Release and Debug)
        run: |
          cd mobile_app
          flutter build apk --debug
          flutter build apk --release

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: ParkFlow-Android-Release-APK
          path: mobile_app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Upload Debug APK (Instant Sideload)
        uses: actions/upload-artifact@v4
        with:
          name: ParkFlow-Android-Debug-APK
          path: mobile_app/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30

      - name: Publish Direct APK Download on GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.3
          name: "ParkFlow Mobile v1.0.3 APK Release"
          body: |
            ### 🅿️ ParkFlow Smart Parking Mobile App (Android APK v1.0.3)
            The official compiled ParkFlow Mobile App with full live dashboard, advance booking, FASTag exit, and bay visualizer.
            
            Download and tap the APK directly on your phone to install:
            - **`app-debug.apk`** (Recommended for instant testing without keystore verification)
            - **`app-release.apk`** (Optimized release build)
          files: |
            mobile_app/build/app/outputs/flutter-apk/app-release.apk
            mobile_app/build/app/outputs/flutter-apk/app-debug.apk
