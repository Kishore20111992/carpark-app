name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Prepare Android Project & Dependencies
        run: |
          cd mobile_app
          cp -r lib /tmp/parkflow_lib
          cp pubspec.yaml /tmp/parkflow_pubspec.yaml
          flutter create . --platforms=android --org com.parkflow.app --project-name parkflow_mobile
          rm -rf lib test
          cp -r /tmp/parkflow_lib lib
          cp /tmp/parkflow_pubspec.yaml pubspec.yaml
          python3 configure_android.py
          flutter pub get

      - name: Build Android APKs (Release and Debug)
        run: |
          cd mobile_app
          flutter build apk --debug
          flutter build apk --release

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: ParkFlow-Android-Release-APK
          path: mobile_app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Upload Debug APK (Instant Sideload)
        uses: actions/upload-artifact@v4
        with:
          name: ParkFlow-Android-Debug-APK
          path: mobile_app/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30

      - name: Publish Direct APK Download on GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.8
          name: "ParkFlow Mobile v1.0.8 APK (Mandatory Driver Labels Update)"
          body: |
            ### 🅿️ ParkFlow Smart Parking Mobile App (Android APK v1.0.8)
            Updated Check-In field labels:
            - **Mandatory Labels**: Updated Driver Name and Driver Phone from `(Optional)` to mandatory `*` format (`Driver Name *` and `Driver Phone *`).
            - **Mockup Parity**: Deep Navy `#1E3A8A` AppBar, `● LIVE` badge, 4-metric availability card, action cards, 3-column bay grid, and 5-tab bottom bar.
            - **LAN Wi-Fi & SSL Trust**: Defaults to Host PC (`10.9.240.129:8000`) with self-signed SSL certificate bypass.
            
            Download and install directly on your phone:
            - **`app-debug.apk`** (Recommended for instant testing without keystore signature prompts)
            - **`app-release.apk`** (Optimized release build)
          files: |
            mobile_app/build/app/outputs/flutter-apk/app-release.apk
            mobile_app/build/app/outputs/flutter-apk/app-debug.apk
