name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Prepare Android Project & Dependencies
        run: |
          # 1. Cleanly remove the partial android directory
          rm -rf mobile_app/android
          # 2. Generate clean, complete Android harness in a temporary directory
          flutter create temp_app --platforms=android --org com.parkflow.app --project-name parkflow_mobile
          # 3. Move the complete android directory directly into mobile_app/android
          mv temp_app/android mobile_app/android
          rm -rf temp_app
          # 4. Ensure INTERNET permission is present in AndroidManifest.xml
          python3 -c "
          with open('mobile_app/android/app/src/main/AndroidManifest.xml', 'r') as f:
              t = f.read()
          if 'android.permission.INTERNET' not in t:
              t = t.replace('<application', '<uses-permission android:name=\"android.permission.INTERNET\"/>\n    <application')
          with open('mobile_app/android/app/src/main/AndroidManifest.xml', 'w') as f:
              f.write(t)
          "
          # 5. Install dependencies
          cd mobile_app
          flutter pub get

      - name: Build Android APKs (Release and Debug)
        run: |
          cd mobile_app
          flutter build apk --debug --verbose
          flutter build apk --release --verbose

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: ParkFlow-Android-Release-APK
          path: mobile_app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Upload Debug APK (Instant Sideload)
        uses: actions/upload-artifact@v4
        with:
          name: ParkFlow-Android-Debug-APK
          path: mobile_app/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30

      - name: Publish Direct APK Download on GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.2
          name: "ParkFlow Mobile v1.0.2 APK Release"
          body: |
            ### 🅿️ ParkFlow Smart Parking Mobile App (Android APK v1.0.2)
            The official compiled ParkFlow Mobile App with full live dashboard, advance booking, FASTag exit, and bay visualizer.
            
            Download and tap the APK directly on your phone to install:
            - **`app-debug.apk`** (Recommended for instant testing without keystore verification)
            - **`app-release.apk`** (Optimized release build)
          files: |
            mobile_app/build/app/outputs/flutter-apk/app-release.apk
            mobile_app/build/app/outputs/flutter-apk/app-debug.apk
