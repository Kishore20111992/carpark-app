name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Prepare Android Project & Dependencies
        run: |
          cd mobile_app
          cp -r lib /tmp/parkflow_lib
          cp pubspec.yaml /tmp/parkflow_pubspec.yaml
          flutter create . --platforms=android --org com.parkflow.app --project-name parkflow_mobile
          rm -rf lib test
          cp -r /tmp/parkflow_lib lib
          cp /tmp/parkflow_pubspec.yaml pubspec.yaml
          python3 configure_android.py
          flutter pub get

      - name: Build Android APKs (Release and Debug)
        run: |
          cd mobile_app
          flutter build apk --debug
          flutter build apk --release

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: ParkFlow-Android-Release-APK
          path: mobile_app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Upload Debug APK (Instant Sideload)
        uses: actions/upload-artifact@v4
        with:
          name: ParkFlow-Android-Debug-APK
          path: mobile_app/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30

      - name: Publish Direct APK Download on GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.6
          name: "ParkFlow Mobile v1.0.6 APK Release (LAN & Self-Signed SSL Fixed)"
          body: |
            ### 🅿️ ParkFlow Smart Parking Mobile App (Android APK v1.0.6)
            Updated for physical smartphone LAN Wi-Fi connection and self-signed SSL certificate bypass!
            - **Physical Phone Wi-Fi Connection**: Defaults to Host PC Wi-Fi IP (`10.9.240.129:8000`).
            - **Self-Signed SSL Bypass**: Custom `HttpOverrides` registered to smoothly allow HTTPS API requests with self-signed certificates without SSL handshake rejections.
            - **Live Server Configuration Modal**: Tap the ⚙️ icon in the top AppBar to switch server IP, choose quick presets (Host Wi-Fi, Emulator, Localhost), and run live ping connection tests.
            - **Full Feature Parity**: 2D Bay visualizer, KPI drill-downs, Check-In with FASTag, Exit & Settle with Model B live bill preview & invoice card, Advance Bookings ledger, Vehicle Locator, and Analytics & Tariff rates editor.
            
            Download and install directly on your phone:
            - **`app-debug.apk`** (Recommended for instant testing without keystore signature prompts)
            - **`app-release.apk`** (Optimized release build)
          files: |
            mobile_app/build/app/outputs/flutter-apk/app-release.apk
            mobile_app/build/app/outputs/flutter-apk/app-debug.apk
